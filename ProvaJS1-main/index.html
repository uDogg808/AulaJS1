<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Compra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Simulador de Compra</h1>

        <div class="campo">
            <label for="valor">Valor da compra (R$):</label>
            <input type="number" id="valor" placeholder="Ex: 600.00" step="0.01">
        </div>

        <div class="campo">
            <label for="parcelas">Número de parcelas (1 a 12):</label>
            <input type="number" id="parcelas" placeholder="Ex: 3" min="1" max="12">
        </div>

        <button id="btnSimular">Simular</button>

        <p id="resumo"></p>
        <ul id="parcelasLista"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
