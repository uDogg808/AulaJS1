<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>calculadora</title>
</head>
<body>
    <h1>calculadora com funções</h1>
<div class="calculadora">
    <div class="campos">
        <input type="number" id="num1" placeholder="Digite um número"> 
        <input type="number" id="num2" placeholder="Digite um número">
    </div>

    <div>
        <button id="soma">+</button>
        <button id="sub">-</button>
        <button id="multi">×</button>
        <button id="divi">/</button>
    </div>
    <p id="resultado"></p>
</div>

<script src="script.js"></script>

</body>
</html>
